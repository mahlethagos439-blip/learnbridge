<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnBridge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f4f7fc;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .container img {
            width: 100%;
            height: auto;
            display: block;
            /* This shifts the image up to perfectly hide the phone status bar/time at the top */
            margin-top: -55px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Displays your exact uploaded image -->
        <img src="home.png" alt="LearnBridge Homepage">
    </div>

</body>
</html>
