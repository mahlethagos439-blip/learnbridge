<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnBridge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .frame {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
        }
        .frame img {
            width: 100%;
            height: auto;
            display: block;
            margin-top: -8.5%; /* Crops out the top status bar cleanly */
        }
        area {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="frame">
        <!-- Your exact uploaded photo -->
        <img src="home.png" alt="LearnBridge Homepage" usemap="#learnbridge-map">

        <map name="learnbridge-map">
            <!-- Top Right Hamburger Menu -->
            <area shape="rect" coords="350,110,410,160" alt="Menu" onclick="alert('Menu opened!')">

            <!-- Start Learning Button -->
            <area shape="rect" coords="55,360,200,410" alt="Start Learning" onclick="alert('Starting your learning journey!')">

            <!-- Subject Cards -->
            <area shape="rect" coords="40,650,115,770" alt="Mathematics" onclick="alert('Opening Mathematics Notes')">
            <area shape="rect" coords="135,650,210,770" alt="Physics" onclick="alert('Opening Physics Notes')">
            <area shape="rect" coords="225,650,300,770" alt="Chemistry" onclick="alert('Opening Chemistry Notes')">
            <area shape="rect" coords="315,650,390,770" alt="Biology" onclick="alert('Opening Biology Notes')">

            <area shape="rect" coords="40,780,125,900" alt="Geography" onclick="alert('Opening Geography Notes')">
            <area shape="rect" coords="135,780,225,900" alt="History" onclick="alert('Opening History Notes')">
            <area shape="rect" coords="235,780,325,900" alt="Economics" onclick="alert('Opening Economics Notes')">

            <!-- Go to Exams Button -->
            <area shape="rect" coords="290,950,390,990" alt="Go to Exams" onclick="alert('Redirecting to Exams!')">

            <!-- Bottom Navigation Items -->
            <area shape="rect" coords="50,1030,100,1080" alt="Home" onclick="alert('Home tab')">
            <area shape="rect" coords="120,1030,180,1080" alt="Lessons" onclick="alert('Lessons tab')">
            <area shape="rect" coords="190,1030,250,1080" alt="Quizzes" onclick="alert('Quizzes tab')">
            <area shape="rect" coords="260,1030,320,1080" alt="Progress" onclick="alert('Progress tab')">
            <area shape="rect" coords="330,1030,390,1080" alt="Profile" onclick="alert('Profile tab')">
        </map>
    </div>

</body>
</html>
