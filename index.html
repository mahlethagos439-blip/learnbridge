<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LearnBridge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
        }
        .full-screen-frame {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .full-screen-frame img {
            width: 100%;
            height: 108%; /* Expands image height to fill screen top-to-bottom */
            object-fit: fill; /* Stretches photo smoothly to eliminate white space */
            margin-top: -8%; /* Crops the top status bar */
            display: block;
        }
        area {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="full-screen-frame">
        <!-- Exact uploaded photo filling the entire screen -->
        <img src="home.png" alt="LearnBridge Homepage" usemap="#learnbridge-map">

        <map name="learnbridge-map">
            <!-- Top Right Hamburger Menu -->
            <area shape="rect" coords="350,100,410,150" alt="Menu" onclick="alert('Menu opened!')">

            <!-- Start Learning Button -->
            <area shape="rect" coords="55,350,200,400" alt="Start Learning" onclick="alert('Starting your learning journey!')">

            <!-- Subject Cards -->
            <area shape="rect" coords="40,640,115,760" alt="Mathematics" onclick="alert('Opening Mathematics Notes')">
            <area shape="rect" coords="135,640,210,760" alt="Physics" onclick="alert('Opening Physics Notes')">
            <area shape="rect" coords="225,640,300,760" alt="Chemistry" onclick="alert('Opening Chemistry Notes')">
            <area shape="rect" coords="315,640,390,760" alt="Biology" onclick="alert('Opening Biology Notes')">

            <area shape="rect" coords="40,770,125,890" alt="Geography" onclick="alert('Opening Geography Notes')">
            <area shape="rect" coords="135,770,225,890" alt="History" onclick="alert('Opening History Notes')">
            <area shape="rect" coords="235,770,325,890" alt="Economics" onclick="alert('Opening Economics Notes')">

            <!-- Go to Exams Button -->
            <area shape="rect" coords="290,940,390,980" alt="Go to Exams" onclick="alert('Redirecting to Exams!')">

            <!-- Bottom Navigation Items -->
            <area shape="rect" coords="50,1020,100,1070" alt="Home" onclick="alert('Home tab')">
            <area shape="rect" coords="120,1020,180,1070" alt="Lessons" onclick="alert('Lessons tab')">
            <area shape="rect" coords="190,1020,250,1070" alt="Quizzes" onclick="alert('Quizzes tab')">
            <area shape="rect" coords="260,1020,320,1070" alt="Progress" onclick="alert('Progress tab')">
            <area shape="rect" coords="330,1020,390,1070" alt="Profile" onclick="alert('Profile tab')">
        </map>
    </div>

</body>
</html>
