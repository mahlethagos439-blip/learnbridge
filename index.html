<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LearnBridge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            background-color: #ffffff;
            overflow-x: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            background-color: #ffffff;
            position: relative;
        }
        /* Container that crops the top status bar while keeping full vertical height for bottom features */
        .image-crop-box {
            width: 100%;
            overflow: hidden;
            position: relative;
        }
        .image-crop-box img {
            width: 100%;
            height: auto;
            display: block;
            margin-top: -8.5%; /* Cleanly crops out the top phone time/status bar */
            margin-bottom: -1%;
        }
        area {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="image-crop-box">
            <!-- Exact uploaded photo -->
            <img src="home.png" alt="LearnBridge Homepage" usemap="#learnbridge-map">

            <!-- Clickable Hotspots Map -->
            <map name="learnbridge-map">
                <!-- Top Right Hamburger Menu -->
                <area shape="rect" coords="340,110,410,170" alt="Menu" onclick="alert('Menu opened!')">

                <!-- Start Learning Button -->
                <area shape="rect" coords="45,360,215,420" alt="Start Learning" onclick="alert('Starting your learning journey!')">

                <!-- Quick Stats / Subject Cards Clickable Areas -->
                <area shape="rect" coords="30,650,115,770" alt="Mathematics" onclick="alert('Opening Mathematics Notes')">
                <area shape="rect" coords="130,650,215,770" alt="Physics" onclick="alert('Opening Physics Notes')">
                <area shape="rect" coords="225,650,310,770" alt="Chemistry" onclick="alert('Opening Chemistry Notes')">
                <area shape="rect" coords="320,650,405,770" alt="Biology" onclick="alert('Opening Biology Notes')">

                <area shape="rect" coords="30,780,125,900" alt="Geography" onclick="alert('Opening Geography Notes')">
                <area shape="rect" coords="135,780,230,900" alt="History" onclick="alert('Opening History Notes')">
                <area shape="rect" coords="240,780,335,900" alt="Economics" onclick="alert('Opening Economics Notes')">

                <!-- Go to Exams Button -->
                <area shape="rect" coords="280,950,405,1000" alt="Go to Exams" onclick="alert('Redirecting to Exams!')">

                <!-- Bottom Navigation Bar (Fully visible at the end) -->
                <area shape="rect" coords="35,1030,105,1100" alt="Home" onclick="alert('Home tab')">
                <area shape="rect" coords="115,1030,185,1100" alt="Lessons" onclick="alert('Lessons tab')">
                <area shape="rect" coords="195,1030,265,1100" alt="Quizzes" onclick="alert('Quizzes tab')">
                <area shape="rect" coords="275,1030,345,1100" alt="Progress" onclick="alert('Progress tab')">
                <area shape="rect" coords="355,1030,425,1100" alt="Profile" onclick="alert('Profile tab')">
            </map>
        </div>
    </div>

</body>
</html>
